<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b7a75" />
      <stop offset="60%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="pillGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="192" height="192" rx="44" fill="url(#bgGrad)" />

  <!-- Bio / Molecule orbital ring -->
  <ellipse cx="96" cy="96" rx="68" ry="26" fill="none" stroke="url(#ringGrad)" stroke-width="4.5" transform="rotate(-30 96 96)" stroke-dasharray="140 16 20 16" />
  <circle cx="152" cy="62" r="5.5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="40" cy="130" r="4.5" fill="#2dd4bf" filter="url(#glow)" />

  <!-- Central Capsule (Pill) angled at 45 deg -->
  <g transform="translate(96, 96) rotate(-45) translate(-96, -96)" filter="url(#glow)">
    <!-- Top / Left Half of Capsule (Cyan/Blue) -->
    <path d="M72,96 L72,62 C72,48.7 82.7,38 96,38 C109.3,38 120,48.7 120,62 L120,96 Z" fill="url(#pillGrad1)" />
    <!-- Bottom / Right Half of Capsule (Crisp White) -->
    <path d="M72,96 L72,130 C72,143.3 82.7,154 96,154 C109.3,154 120,143.3 120,130 L120,96 Z" fill="url(#pillGrad2)" />
    <!-- Divider band & highlight -->
    <line x1="72" y1="96" x2="120" y2="96" stroke="#0369a1" stroke-width="2.5" opacity="0.6" />
    <!-- Pill reflection sheen -->
    <path d="M80,56 C80,48 87,44 96,44" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.75" />
  </g>

  <!-- Medical Cross Accent in bottom corner -->
  <g transform="translate(136, 136)" filter="url(#glow)">
    <circle cx="10" cy="10" r="14" fill="#0284c7" />
    <path d="M10,4 L10,16 M4,10 L16,10" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
